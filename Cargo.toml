[package]
name = "mq-bridge-pulsar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Apache Pulsar endpoint extension for mq-bridge"

[lib]
# `rlib` for Rust users who link the endpoint directly; `cdylib` is the loadable
# plugin the Python and npm packages ship and `load_endpoint_plugin` opens.
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
# mq-bridge = { version = "0.3.10", default-features = false } # use for later release, do not remove
mq-bridge = { path = "../mq-bridge", version = "0.3.11", default-features = false }
pulsar = { version = "6.3.1", default-features = false, features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.34", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
mq-bridge = { path = "../mq-bridge", version = "0.3.10", default-features = false, features = ["plugin-sdk", "test-utils"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "pulsar_to_file"
required-features = ["example-app"]

[features]
# The plugin export is on by default: it is what the Python and npm packages
# load. Turn it off (`default-features = false`) when linking this crate
# directly alongside another plugin, since both would define the same
# `mq_bridge_plugin_v1` symbol.
default = ["plugin"]
plugin = ["mq-bridge/plugin-sdk"]
example-app = []
